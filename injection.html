    <div id="loading-animation">

    </div>

    <div id="template-container">
        <template id="announcement-veiw">
            <div id="container">
                <div class="div-centerer" id="announcement-text">
                    <h1 class="title-text" id="announcement-title">Announcement</h1>
                    <p class="total-score" id="announcement-number">0/0</p>
                </div>
                <div class="div-centerer" id="announcement-bar">
                    <div class="loading-bar"  id="announcement-progress-bar">
                        <div class="inner-loading-bar" id="announcement-progress"></div>
                    </div>
                </div>
            </div>
            <div id="announcement-module-container">
                
            </div>
        </template>
        <template id="assignment-veiw">
            <div id="container">
                <div class="div-centerer" id="assignment-text">
                    <h1 class="title-text" id="assignment-title">Assignments</h1>
                    <p class="total-score" id="assignment-number">0/0</p>
                </div>
                <div class="div-centerer" id="dated-bar">
                    <div class="loading-bar"  id="assignment-progress-bar">
                        <div class="inner-loading-bar" id="assignment-progress"></div>
                    </div>
                </div>
                <div class="div-centerer" id="undated-assignment-text">
                    <h1 class="title-text" id="undated-assignment-title">Undated</h1>
                    <p class ="total-score" id="undated-assignment-number">0/0</p>
                </div>
                <div class="div-centerer" id="undated-bar">
                    <div class="loading-bar" id="undated-assignment-progress-bar">
                        <div class="inner-loading-bar id="undated-assignment-progress"></div>
                    </div>
                </div>
                <div id="assignment-module-container">
                    
                </div>
            </div>
        </template>
        <template id="grade-veiw">
            <div id="scrollable-shell">
                <h1>grades</h1>
                <div id="grade-container">
                </div>
            </div>
        </template>
    </div>
